name: Discord release announce

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Docker image to be published
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Announce on Discord only once the image is actually pullable, so the
          # "New release published" ping never arrives before the Docker Hub tag
          # exists (the build can take 20-40 min, and longer if it stalls). Poll
          # the public Docker Hub tags API for the version tag (v-prefix stripped)
          # until it returns 200, then let the announce step run.
          IMG_TAG="${TAG#v}"
          API="https://hub.docker.com/v2/repositories/60plus/gamesdownloader/tags/${IMG_TAG}"
          echo "Waiting for Docker Hub tag: ${IMG_TAG}"
          for i in $(seq 1 120); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API")
            if [ "$CODE" = "200" ]; then
              echo "Image ${IMG_TAG} is available after ~$(( (i - 1) * 30 ))s."
              exit 0
            fi
            echo "[$i/120] image not ready yet (HTTP ${CODE}); waiting 30s..."
            sleep 30
          done
          echo "::error::Docker image ${IMG_TAG} did not appear within ~60 min; not announcing. Re-publish the release once the image is built to retry."
          exit 1

      - name: Post release to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          AUTHOR: ${{ github.event.release.author.login }}
          RELEASE_ID: ${{ github.event.release.id }}
          FALLBACK_URL: ${{ github.event.release.html_url }}
          FALLBACK_NAME: ${{ github.event.release.name }}
          FALLBACK_BODY: ${{ github.event.release.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The event payload freezes the release as it stood the instant it was
          # published: assets uploaded a moment later are simply not in it, a
          # note corrected afterwards is not either, and a re-run replays that
          # same frozen copy. Read the release now instead, and keep the payload
          # only as the fallback for when the API cannot be reached.
          REL=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            || echo 'null')
          if echo "$REL" | jq -e 'type == "object" and has("assets")' >/dev/null 2>&1; then
            ASSETS=$(echo "$REL" | jq '.assets')
            BODY=$(echo "$REL" | jq -r '.body // ""')
            URL=$(echo "$REL" | jq -r '.html_url')
            NAME=$(echo "$REL" | jq -r '.name // .tag_name')
            echo "Read the release live: $(echo "$ASSETS" | jq 'length') assets."
          else
            ASSETS='[]'
            BODY="$FALLBACK_BODY"
            URL="$FALLBACK_URL"
            NAME="$FALLBACK_NAME"
            echo "::warning::Could not read the release; falling back to the event payload, without assets."
          fi

          # A release note runs longer than an embed should carry. Everything
          # above an HTML "more" marker is the short version written for the
          # announcement; the rest stays on the release page. A note without a
          # marker still announces, trimmed where the payload is built below.
          DESCRIPTION=$(echo "$BODY" \
            | awk 'index($0, "<!-- more -->") { exit } { print }')

          # Up to four image assets become a gallery. Extra embeds that share the
          # release URL are merged by Discord into one gallery under the main embed,
          # so attaching screenshots to the release shows them inline.
          IMAGE_EMBEDS=$(echo "$ASSETS" | jq --arg url "$URL" '
            [ .[]
              | select((.content_type // "" | startswith("image/"))
                       or (.name | test("\\.(png|jpe?g|webp|gif)$"; "i")))
              | { url: $url, image: { url: .browser_download_url } }
            ] | .[0:4]')

          # Direct video links (webm/mp4) found in the release body go into the
          # plain message content - Discord renders a playable player for raw
          # video URLs there (embeds cannot). First link only, to keep it tidy.
          VIDEO_URL=$(echo "$BODY" | grep -oE 'https://[^ )>]+\.(webm|mp4)' | head -1 || true)
          CONTENT=":rocket: **New release published!**"
          if [ -n "$VIDEO_URL" ]; then
            CONTENT="$CONTENT
          $VIDEO_URL"
          fi

          # Build JSON payload using jq for safe escaping.
          #
          # Discord refuses the entire request if a description runs past 4096
          # characters, so it is trimmed to 4000 with room to spare. The trim
          # is done here rather than in the shell because jq counts characters
          # where head counts bytes, and a cut through a multi-byte character
          # would produce invalid JSON.
          PAYLOAD=$(jq -n \
            --arg title "$NAME" \
            --arg url "$URL" \
            --arg desc "$DESCRIPTION" \
            --arg tag "$TAG" \
            --arg author "$AUTHOR" \
            --arg content "$CONTENT" \
            --argjson images "$IMAGE_EMBEDS" \
            '{
              content: $content,
              embeds: ([{
                title: $title,
                url: $url,
                description: $desc[0:4000],
                color: 10180351,
                fields: [
                  { name: "Tag", value: $tag, inline: true },
                  { name: "By", value: $author, inline: true }
                ],
                footer: { text: "GamesDownloader" }
              }] + $images)
            }')

          # Discord answers 204 on success. Without --fail-with-body a rejected
          # payload would leave this job green with nothing posted, which is the
          # one failure nobody would notice.
          curl --fail-with-body -sS -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"

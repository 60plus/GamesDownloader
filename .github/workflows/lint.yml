name: CI

# Runs on every push to main and on PRs.
#
# Six gates: the backend test suite, a vulnerability audit of the declared
# Python dependencies, the same for the JavaScript ones, ruff, the frontend
# type-check, and a syntax check of the translation files. It was three until
# 1.0.31 - the suite itself, the largest safety net in the project, was not
# among them.
#
# WHAT THIS DOES NOT DO, because the trigger below says so: it runs on pushes
# to main and on pull requests, and main receives a handful of commits per
# RELEASE. So the dependency audits answer at release time, not while an
# advisory is landing. Anything that needs to notice sooner has to watch
# continuously, which is a different tool.
#
# What it tells a reader of the public repo is whether the published commit
# stands up on its own, which is the only signal someone deploying this from
# GitHub has.
#
# Concurrency below cancels superseded runs, so these never pile up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit lands on the same ref so
# we never pile up wasted minutes on outdated trees.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend: the test suite ──────────────────────────────────────────────
  tests:
    name: pytest (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Run the suite
        # No services needed: these are unit tests. conftest.py sets the auth
        # secret before anything imports config, and nothing here opens a
        # database or a Redis connection - the handlers that would are driven
        # through stubs. pytest reads testpaths and pythonpath from the root
        # pyproject.toml, so it runs from the root.
        run: python -m pytest -q

  # ── Dependencies: known vulnerabilities ──────────────────────────────────
  audit:
    name: pip-audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit the declared dependencies
        # Audits what a fresh install would resolve to, which is the question
        # that matters for someone deploying this. Deliberately not an audit of
        # the whole environment: that also reports on pip and the runner's own
        # tooling, which says nothing about this application. It was clean when
        # this gate was added, so a failure here is news.
        #
        # If an advisory ever lands with no fix available, add
        # `--ignore-vuln <ID>` here with a comment saying why, rather than
        # deleting the job.
        run: pip-audit --progress-spinner off -r backend/requirements.txt

  # ── Frontend dependencies: known vulnerabilities ─────────────────────────
  #
  # The counterpart of pip-audit above, and it is here because the two sides
  # were not treated alike. Python dependencies were audited by a job that
  # fails; JavaScript ones were audited only inside the Docker build, by
  # `npm audit --audit-level=high || true`, which reports and carries on. That
  # is how twelve advisories - nine of them high, and five on packages that
  # reach the browser - came to sit in the lockfile with nobody stopped.
  npm-audit:
    name: npm audit (frontend dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit what ships to the browser
        working-directory: frontend
        # PRODUCTION dependencies only, and this one fails. These end up in the
        # bundle a person loads, so an advisory here is about the running
        # application rather than about the machine that built it.
        #
        # Clean when this gate was added, so a failure is news. If an advisory
        # ever lands with no fix available, narrow this with a comment saying
        # why rather than deleting the job.
        run: npm audit --omit=dev --audit-level=high
      - name: Report the build tooling separately
        working-directory: frontend
        # Never fails, on purpose. A path traversal in a dev server matters to
        # somebody running `npm run dev`, not to the container: the frontend is
        # built in the first stage of the Dockerfile and the tool is not in the
        # image at all. Mixing the two is what made the real ones easy to
        # scroll past.
        if: always()
        run: npm audit --audit-level=high || true

  # ── Backend: Ruff ────────────────────────────────────────────────────────
  ruff:
    name: ruff (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Run ruff check
        # Ruff with default rules (E, F) - syntax errors, undefined names,
        # unused imports. Anything stricter is opt-in via pyproject.toml.
        run: ruff check backend/

  # ── Frontend: TypeScript type-check ──────────────────────────────────────
  type-check:
    name: vue-tsc (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        # `npm ci` requires a lockfile; if missing, fall back to `npm install`
        # so the workflow does not fail on a fresh repo before the first
        # lockfile commit lands.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: vue-tsc --noEmit
        working-directory: frontend
        run: npm run type-check

  # ── i18n: JSON syntax validation ─────────────────────────────────────────
  i18n-json:
    name: i18n JSON syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate translation files
        # Catches trailing commas, unterminated strings, mismatched braces -
        # the kind of typos that previously broke the bundle silently and
        # only surfaced as a missing translation at runtime.
        run: |
          set -e
          fail=0
          for f in frontend/src/i18n/*.json frontend/public/i18n/*.json; do
            if ! python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f"; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done
          exit "$fail"
      - name: Every language carries every key
        # The eight files have been kept exactly in step by hand - 2602 keys
        # each, nothing missing - and nothing was checking. A key added to
        # English alone passes the syntax check above and then shows the reader
        # its own name where a sentence should be, in seven languages, silently.
        #
        # English is the reference because it is where a new key is written
        # first. Extra keys in a translation are reported too: they are almost
        # always a rename that only landed on one side.
        run: |
          python - <<'PY'
          import glob, io, json, os, sys

          en = json.load(io.open("frontend/src/i18n/en.json", encoding="utf-8"))
          bad = 0
          for path in sorted(glob.glob("frontend/public/i18n/*.json")):
              other = json.load(io.open(path, encoding="utf-8"))
              missing = sorted(set(en) - set(other))
              extra = sorted(set(other) - set(en))
              if missing:
                  bad = 1
                  print(f"::error file={path}::{len(missing)} key(s) missing: "
                        + ", ".join(missing[:12]) + (" ..." if len(missing) > 12 else ""))
              if extra:
                  bad = 1
                  print(f"::error file={path}::{len(extra)} key(s) not in en.json: "
                        + ", ".join(extra[:12]) + (" ..." if len(extra) > 12 else ""))
          if not bad:
              print(f"{len(en)} keys, all languages in step.")
          sys.exit(bad)
          PY

name: Docker publish

# Builds the application image and pushes it to Docker Hub.
#
# One-time setup: add two repository secrets under
# Settings -> Secrets and variables -> Actions:
#   DOCKERHUB_USERNAME  your Docker Hub account name
#   DOCKERHUB_TOKEN     a Docker Hub access token (Account Settings -> Security)
#
# Triggers:
#   - push a version tag like v1.2.3  -> publishes :1.2.3, :1.2 and :latest
#   - manual run from the Actions tab -> publishes the tag you type (default :latest)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        required: false
        default: 'latest'

env:
  IMAGE: 60plus/gamesdownloader

jobs:
  docker:
    runs-on: ubuntu-latest
    # A cold multi-arch build takes 16 to 20 minutes, most of it arm64 under
    # emulation. Anything past 45 is not slow, it is stuck, and without this
    # the job would sit there until the six hour default killed it.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # arm64 is built under QEMU emulation, which is slow (tens of minutes).
          # Drop linux/arm64 below if it causes trouble or you only target x86 hosts.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No layer cache on purpose. The Actions cache is scoped per ref and
          # this workflow only ever runs on a tag, so one release could never
          # read what the previous one wrote: every build here has always been
          # cold, and cache-to only filled the shared 10 GB budget with blobs
          # nothing would ever read, crowding out the pip and npm caches that
          # the test workflow does reuse. A cold build is also the honest one:
          # a cached pip layer keeps whatever versions it was built with, so a
          # patched dependency would silently never reach the image.
